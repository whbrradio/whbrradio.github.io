<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHBR Radio</title>

<link rel="icon" href="whbr-logo.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="top-bar">

    <div class="logo-area">
        <img src="whbr-logo.png" class="top-logo">
    </div>


    <div class="top-now-playing">

        <div class="top-live">
            <span class="live-dot"></span>
            LIVE
        </div>


        <div class="top-song">

            <div id="top-title">
                Loading...
            </div>

            <div id="top-artist">
                WHBR
            </div>

        </div>

    </div>


</header>





<main>


<section class="player-section">


<div class="player-card">



<div class="album-container">

<img id="album-cover" src="whbr-logo.png">

</div>




<div class="song-info">


<h1 id="song-title">
Loading Song...
</h1>


<h2 id="song-artist">
WHBR Radio
</h2>



</div>





<button id="play-button">

▶

</button>




</div>



<audio id="radio-stream">

<source 
src="https://wrap-rico-take-album.trycloudflare.com/stream"
type="audio/mpeg">

</audio>


</section>

<!-- =========================
     RECENTLY PLAYED
========================= -->


<section class="content-section">


<h2 class="section-title">
Recently Played
</h2>



<div id="recent-list">


<div class="recent-placeholder">
Waiting for songs...
</div>


</div>


</section>







<!-- =========================
     NEWS
========================= -->


<section class="content-section">


<h2 class="section-title">
WHBR News
</h2>



<div class="news-card">


<h3>
WHBR Rock News
</h3>


<p>
The latest rock music updates and station news.
</p>



</div>


</section>







<!-- =========================
     ABOUT
========================= -->


<section class="about-section">


<h2>
About WHBR
</h2>


<p>

WHBR is your home for classic rock,
bringing you the greatest rock songs
24/7.

</p>


<p>

Turn it up and enjoy the music.

</p>


</section>





</main>







<script>


// ============================
// WHBR SETTINGS
// ============================


// YOUR NOW PLAYING FILE

const songURL = "https://resolution-warren-fly-conf.trycloudflare.com/nowplaying.txt";



// STREAM

const stream = document.getElementById("radio-stream");



const playButton = document.getElementById("play-button");



const title = document.getElementById("song-title");

const artist = document.getElementById("song-artist");



const topTitle = document.getElementById("top-title");

const topArtist = document.getElementById("top-artist");



const album = document.getElementById("album-cover");



let lastSong = "";

let recentSongs = [];






// ============================
// PLAY BUTTON
// ============================


playButton.onclick = function(){


if(stream.paused){

stream.play();

playButton.innerHTML="❚❚";


}

else{

stream.pause();

playButton.innerHTML="▶";


}


};






// ============================
// NOW PLAYING
// ============================


async function updateSong(){


try{


let response = await fetch(
songURL + "?t=" + Date.now()
);



let data = await response.text();



data=data.trim();



if(!data || data===lastSong)
return;



lastSong=data;




let split=data.split(" - ");



let song=split.slice(1).join(" - ");

let band=split[0];





if(!song){

song=data;

band="WHBR";

}





title.innerHTML=song;

artist.innerHTML=band;



topTitle.innerHTML=song;

topArtist.innerHTML=band;



addRecent(band+" - "+song);



}


catch(err){

console.log(err);

}



}

// ============================
// ALBUM ART
// ============================


async function getAlbumArt(song, band){


try{


let query = encodeURIComponent(
band + " " + song
);



let result = await fetch(
"https://itunes.apple.com/search?term="
+ query +
"&media=music&limit=1"
);



let json = await result.json();



if(json.results.length){


album.src =
json.results[0].artworkUrl100.replace(
"100x100",
"600x600"
);


}


else{


album.src="whbr-logo.png";


}



}

catch{


album.src="whbr-logo.png";


}



}








// ============================
// RECENT SONGS
// ============================


function addRecent(song){



if(recentSongs.includes(song))
return;



recentSongs.unshift(song);



if(recentSongs.length > 5){

recentSongs.pop();

}



let box =
document.getElementById("recent-list");



box.innerHTML="";



recentSongs.forEach(item=>{



let div=document.createElement("div");


div.className="recent-song";


div.innerHTML=`

<div>

<h3>${item}</h3>

<p>Recently Played</p>

</div>

`;



box.appendChild(div);



});



}








// START UPDATES


updateSong();


setInterval(updateSong,10000);




</script>






</body>

</html>
